version: '3.6'

services:

  # Create NMOS Registry/Controller container instance
  nmos-registry:
    image: rhastie/nmos-cpp:latest
    container_name: nmos-registry
    hostname: nmos-registry
    domainname: local
    ports:
    - "80-81:80-81"
    - "1883:1883"
    volumes:
    - "./registry.json:/home/registry.json"
    environment:
    - RUN_NODE=FALSE
    networks: 
      external:
        ipv4_address: '192.168.6.101'

  # Create NMOS Bridge adapter container instance
  nmos-bridge-adapter:
    build:
      context: https://github.com/sony/nmos-js.git#0c361b69beedbbb783bd57cb935588f1e311adfd:nmos-bridge/adapter
    container_name: nmos-bridge-adapter
    restart: unless-stopped
    environment:
      REGISTRY_QUERY_URL: http://192.168.6.101/x-nmos/query/v1.3
      APP_URL: http://192.168.6.101
    volumes:
      - envoy-dynamic:/etc/envoy/dynamic
    networks:
      external:
        ipv4_address: '192.168.6.105'
    depends_on:
      - nmos-registry

  # Create NMOS Bridge (Envoy) container instance
  nmos-bridge:
    image: envoyproxy/envoy:v1.31-latest
    container_name: nmos-bridge
    hostname: nmos-bridge
    domainname: local
    restart: unless-stopped
    volumes:
      - ./nmos-bridge/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./nmos-bridge/envoy/location_rewrite.lua:/etc/envoy/location_rewrite.lua:ro
      - envoy-dynamic:/etc/envoy/dynamic
    networks:
      external:
        ipv4_address: '192.168.6.104'
    depends_on:
      - nmos-bridge-adapter

  # Create NMOS Virtual Node container instance
  nmos-virtnode:
    image: rhastie/nmos-cpp:latest
    container_name: nmos-virtnode
    hostname: nmos-virtnode
    domainname: local
    ports:
    - "80-81:80-81"
    volumes:
    - "./node.json:/home/node.json"
    environment:
    - RUN_NODE=TRUE
    networks:
      external:
        ipv4_address: '192.168.6.102'
    depends_on:
    - nmos-registry

  # Create AMWA NMOS Testing container instance
  nmos-testing:
    image: amwa/nmos-testing:latest
    container_name: nmos-testing
    hostname: nmos-testing
    domainname: local
    entrypoint: |
       /bin/bash -c "/etc/init.d/dbus start;
       /etc/init.d/avahi-daemon start;
       python3 nmos-test.py"
    ports:
    - "5000:5000"
    volumes:
    - "./UserConfig.py:/config/UserConfig.py"
    networks:
      external:
        ipv4_address: '192.168.6.103'
    depends_on:
    - nmos-virtnode


volumes:
  envoy-dynamic:

networks:
    external:
        # Create external macvlan subnet using host physical interface allowing containers to have their own IP addresses
        driver: macvlan
        driver_opts:
            parent: ens33
        ipam:
            config:
            - subnet: 192.168.6.0/24
